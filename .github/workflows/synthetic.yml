name: Synthetic User Traffic Cron

on:
  schedule:
    # Run every 10 minutes (6 times an hour) for baseline telemetry
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target shop URL to hit with synthetic traffic'
        required: false
        default: 'https://aceso-target-shop.vercel.app'

jobs:
  synthetic-traffic:
    name: Run Synthetic User Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # version is automatically read from packageManager field in package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Synthetic Playwright Journeys
        env:
          TARGET_SHOP_URL: ${{ inputs.target_url || vars.TARGET_SHOP_URL || 'https://aceso-target-shop.vercel.app' }}
        run: pnpm test:e2e

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
